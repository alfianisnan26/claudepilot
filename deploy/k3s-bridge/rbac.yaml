# What the cp-bridge's account may do (T-3699, docs/prd/cf-bridge.md "RBAC"): in every workspace namespace, exactly the Role the portal's own
# account has there today (`claudepilot-workspaces`, deploy/k3s/rbac.yaml and workspace-orgs.yaml), and nothing wider. rbac.test.mjs in this
# folder fails when a rule here grants more than that Role. The proxy's allowlist (apps/server/src/connect/agent/services/kube/rules.ts) is
# the first wall and is stricter; this is the second.
#
# One addition, in the namespace the bridge serves (PILOT_KUBE_NAMESPACE in bridge.yaml) only: the agent keeps its identity in the Secret
# `claudepilot-agent-identity` of that namespace (agent/identity.kube.ts, agent/client.ts:371-374), so it may read and write that one
# Secret by name, and create it (create cannot be limited by name). No other Secret, no list.
#
# Not here: a ClusterRole. The fit check (claudepilot-portal-fit-check) and namespace creation stay off for the bridge (G3, PILOT-1157).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cp-bridge
  namespace: isnan-cp-bridge
  labels:
    app.kubernetes.io/name: cp-bridge
    app.kubernetes.io/part-of: cp-bridge
automountServiceAccountToken: false
---
# ---- isnan-claudepilot-workspaces (the portal's `kubernetes` target)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cp-bridge-workspaces
  namespace: isnan-claudepilot-workspaces
  labels: {app.kubernetes.io/part-of: cp-bridge}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cp-bridge-workspaces
  namespace: isnan-claudepilot-workspaces
  labels: {app.kubernetes.io/part-of: cp-bridge}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cp-bridge-workspaces}
subjects:
  - {kind: ServiceAccount, name: cp-bridge, namespace: isnan-cp-bridge}
---
