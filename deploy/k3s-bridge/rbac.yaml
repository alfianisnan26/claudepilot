    resourceNames: ["claudepilot-agent-identity"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cp-bridge-identity
  namespace: isnan-pilot-ws-isnan
  labels: {app.kubernetes.io/part-of: cp-bridge}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cp-bridge-identity}
subjects:
  - {kind: ServiceAccount, name: cp-bridge, namespace: isnan-cp-bridge}
---
