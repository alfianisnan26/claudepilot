# What the portal's Kubernetes target does (apps/server/src/workspaces/kubernetes.ts): one Deployment and one volume claim per
# workspace, a pod list to see them, exec into the pod (shell, files, Claude), the namespace create call it makes before each
# workspace (it is skipped by the API server when the namespace exists, and the call is only allowed to create), and
# the metrics API for CPU and memory figures.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claudepilot-portal
  namespace: isnan-claudepilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claudepilot-workspaces
  namespace: isnan-claudepilot-workspaces
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Browser pool on Kubernetes (browser-desktop-pool PRD §10, T-575): each workspace's `ws-<name>-browser` ConfigMap (the browser's
  # settings) and its egress NetworkPolicy (the browser reaches the internet, not the cluster). Only in this namespace; the same as
  # the B3 rig had.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update", "delete"]
  # Request headers from named secrets (browser-desktop-pool PRD §24, T-623): one `ws-<name>-browser-headers` Secret per workspace that has
  # them, mounted only into its browser container. Create, replace and delete; no list or watch, so the portal can't read other Secrets in
  # this namespace without knowing a name (it reads only its own).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claudepilot-workspaces
  namespace: isnan-claudepilot-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claudepilot-workspaces
subjects:
  - kind: ServiceAccount
    name: claudepilot-portal
    namespace: isnan-claudepilot
---
# The one cluster-wide right: create a namespace (the portal asks before every workspace; "already exists" is expected and fine).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claudepilot-portal-namespace-create
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claudepilot-portal-namespace-create
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claudepilot-portal-namespace-create
subjects:
  - kind: ServiceAccount
    name: claudepilot-portal
    namespace: isnan-claudepilot
---
# The fit check before a workspace's CPU and memory change (T-98, apps/server/src/workspaces/resources.ts): what a node can allocate, and the
# requests of every pod on it. Reads only. Note what it widens: `pods` list across namespaces shows other pods' specs to the portal; the portal
# reads only `spec.nodeName`, the phase and the containers' resource requests, and keeps nothing. Without this role the check is
# "unavailable" and a change is refused (it never guesses).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claudepilot-portal-fit-check
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claudepilot-portal-fit-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claudepilot-portal-fit-check
subjects:
  - kind: ServiceAccount
    name: claudepilot-portal
    namespace: isnan-claudepilot
