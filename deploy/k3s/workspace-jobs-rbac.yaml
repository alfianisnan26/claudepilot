# Least-privilege cluster access for the org workspaces isnan and konfersi (migration C.3.3, 2026-10-31): applied by hand first, kept here as
# it is live (compared with `kubectl get -o yaml`, status and server fields left out; the token Secrets were not read back). Argo CD manages it
# from this file; every object is annotated never to be pruned or deleted with the app (like the org namespaces in workspace-orgs.yaml), so a
# bad sync never takes a workspace's cluster access away mid-run. scripts/job-run.sh and scripts/gate-job.sh work under these accounts
# (gate-job.sh needs no get on Secrets). apps/server/src/workspaces/kubeTargets.test.ts checks the file's shape.
#
# Migration C.3.3: least-privilege cluster access for the org workspaces (isnan, konfersi).
# One ServiceAccount per workspace in isnan-claudepilot (where job-run / gate-job create their Jobs), a long-lived token Secret each,
# a namespaced Role for Jobs + their pods/logs + the per-Job Secret + gate-result ConfigMaps, and a ValidatingAdmissionPolicy that
# keeps "create Jobs" from becoming "run anything as anyone": Jobs/Secrets/ConfigMaps must carry the scripts' names, Jobs get no SA token,
# no service account, only emptyDir volumes, no host namespaces, no privileged containers, and secretKeyRefs only to the Job's own Secret.
#
# The deploy pipeline (.pilot/deploy.yml, run from workspace isnan; 2026-11-01, run rmvxbbfsa6648f8 was refused at its build step): the
# isnan workspace alone also builds the images (scripts/k3s-build.sh: Jobs claudepilot-build-{portal,workspace,workspace-dev,browser}, the
# portal's Secret claudepilot-build, which only the Job claudepilot-build-portal may reference), pre-pulls the new portal image
# (.pilot/scripts/lib.sh prepull: Job claudepilot-prepull-<unix seconds>), waits for the portal's rollout (watch on deployments) and asks
# Argo CD for a refresh (patch on the one Application isnan-claudepilot, limited by claudepilot-ws-argo-refresh-guard to the refresh
# annotation). Those Jobs keep every pod-spec rule above.
apiVersion: v1
kind: ServiceAccount
metadata: {name: ws-isnan-jobs, namespace: isnan-claudepilot, labels: {app.kubernetes.io/part-of: claudepilot, claudepilot/workspace: isnan}, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ws-konfersi-jobs, namespace: isnan-claudepilot, labels: {app.kubernetes.io/part-of: claudepilot, claudepilot/workspace: konfersi}, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata: {name: ws-isnan-jobs-token, namespace: isnan-claudepilot, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false", kubernetes.io/service-account.name: ws-isnan-jobs}}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata: {name: ws-konfersi-jobs-token, namespace: isnan-claudepilot, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false", kubernetes.io/service-account.name: ws-konfersi-jobs}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: claudepilot-ws-jobs, namespace: isnan-claudepilot, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
rules:
  - {apiGroups: [batch], resources: [jobs], verbs: [get, list, watch, create, patch, delete]}
  - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
  - {apiGroups: [""], resources: [pods/log], verbs: [get]}
  - {apiGroups: [""], resources: [events], verbs: [get, list, watch]}
  # The per-Job credential Secret: create/patch/delete only (no get/list/watch), names limited by the policy below.
  - {apiGroups: [""], resources: [secrets], verbs: [create, patch, delete]}
  # Gate results (scripts/gate-record.sh): names limited by the policy below.
  - {apiGroups: [""], resources: [configmaps], verbs: [get, list, create, patch, update, delete]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: claudepilot-ws-jobs, namespace: isnan-claudepilot, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: claudepilot-ws-jobs}
subjects:
  - {kind: ServiceAccount, name: ws-isnan-jobs, namespace: isnan-claudepilot}
  - {kind: ServiceAccount, name: ws-konfersi-jobs, namespace: isnan-claudepilot}
---
# job-run placement: node labels and real memory (kubectl get node, kubectl top nodes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: claudepilot-ws-nodes-read, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
rules:
  - {apiGroups: [""], resources: [nodes], verbs: [get, list]}
  - {apiGroups: [metrics.k8s.io], resources: [nodes, pods], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: claudepilot-ws-nodes-read, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: claudepilot-ws-nodes-read}
subjects:
  - {kind: ServiceAccount, name: ws-isnan-jobs, namespace: isnan-claudepilot}
  - {kind: ServiceAccount, name: ws-konfersi-jobs, namespace: isnan-claudepilot}
---
# job-run's image lookup: GET the registry's tag list through the API server's service proxy (read only).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: claudepilot-ws-registry-read, namespace: isnan-registry, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
rules:
  - {apiGroups: [""], resources: [services/proxy], resourceNames: ["registry:5000", "registry"], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: claudepilot-ws-registry-read, namespace: isnan-registry, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: claudepilot-ws-registry-read}
subjects:
  - {kind: ServiceAccount, name: ws-isnan-jobs, namespace: isnan-claudepilot}
  - {kind: ServiceAccount, name: ws-konfersi-jobs, namespace: isnan-claudepilot}
---
# k3s-status (isnan only): read-only views it prints. Events cluster-wide, deploy/pods/pvc in the portal and workspace namespaces,
# the portal's log, Argo CD applications.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: claudepilot-ws-status-read, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
rules:
  - {apiGroups: [""], resources: [events], verbs: [list]}
  - {apiGroups: [events.k8s.io], resources: [events], verbs: [list]}
  - {apiGroups: [""], resources: [pods], verbs: [list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: claudepilot-ws-status-read, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: claudepilot-ws-status-read}
subjects: [{kind: ServiceAccount, name: ws-isnan-jobs, namespace: isnan-claudepilot}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: claudepilot-ws-status-read, namespace: isnan-claudepilot, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
rules:
  - {apiGroups: [apps], resources: [deployments, replicasets], verbs: [get, list]}
  - {apiGroups: [apps], resources: [deployments/log], verbs: [get]}
  # The deploy pipeline's verify and rollback: `kubectl rollout status deploy/claudepilot-portal` watches the Deployment.
  - {apiGroups: [apps], resources: [deployments], resourceNames: [claudepilot-portal], verbs: [watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: claudepilot-ws-status-read, namespace: isnan-claudepilot, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: claudepilot-ws-status-read}
subjects: [{kind: ServiceAccount, name: ws-isnan-jobs, namespace: isnan-claudepilot}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: claudepilot-ws-status-read, namespace: isnan-claudepilot-workspaces, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
rules:
  - {apiGroups: [apps], resources: [deployments, replicasets], verbs: [get, list]}
  - {apiGroups: [""], resources: [pods, persistentvolumeclaims], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: claudepilot-ws-status-read, namespace: isnan-claudepilot-workspaces, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: claudepilot-ws-status-read}
subjects: [{kind: ServiceAccount, name: ws-isnan-jobs, namespace: isnan-claudepilot}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: claudepilot-ws-status-read, namespace: isnan-argocd, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
rules:
  - {apiGroups: [argoproj.io], resources: [applications], verbs: [get, list]}
  # The deploy pipeline's wait_synced (.pilot/scripts/lib.sh): `kubectl annotate application isnan-claudepilot argocd.argoproj.io/refresh=hard`.
  # Only that Application, and only that annotation (claudepilot-ws-argo-refresh-guard below): never its spec, operation or status.
  - {apiGroups: [argoproj.io], resources: [applications], resourceNames: [isnan-claudepilot], verbs: [patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: claudepilot-ws-status-read, namespace: isnan-argocd, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: claudepilot-ws-status-read}
subjects: [{kind: ServiceAccount, name: ws-isnan-jobs, namespace: isnan-claudepilot}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: claudepilot-ws-jobs-guard, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: isnan-claudepilot}}
    objectSelector: {}
    resourceRules:
      - {apiGroups: [batch], apiVersions: ["*"], operations: [CREATE, UPDATE, DELETE], resources: [jobs], scope: "*"}
      - {apiGroups: [""], apiVersions: ["*"], operations: [CREATE, UPDATE, DELETE], resources: [secrets, configmaps], scope: "*"}
  matchConditions:
    - name: org-workspace-sa
      expression: "request.userInfo.username in ['system:serviceaccount:isnan-claudepilot:ws-isnan-jobs', 'system:serviceaccount:isnan-claudepilot:ws-konfersi-jobs']"
  variables:
    - {name: obj, expression: "request.operation == 'DELETE' ? oldObject : object"}
    - {name: name, expression: "request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name"}
    - {name: pod, expression: "request.resource.resource == 'jobs' && request.operation != 'DELETE' ? object.spec.template.spec : null"}
    - name: ctrs
      expression: "variables.pod == null ? [] : variables.pod.containers + (has(variables.pod.initContainers) ? variables.pod.initContainers : [])"
  validations:
    - expression: "request.resource.resource != 'jobs' || variables.name.matches('^claudepilot-(job-[0-9a-f]{8}|gate-[0-9a-f]{7}-[0-9a-f]{4}|build-(portal|workspace|workspace-dev|browser)|prepull-[0-9]{10}|image-build-[0-9a-f]{8})$')"
      message: "Jobs from a workspace are named by job-run.sh / gate-job.sh / k3s-build.sh / image-build.sh / the deploy pipeline's pre-pull"
    - expression: "request.resource.resource != 'secrets' || variables.name.matches('^claudepilot-(job-[0-9a-f]{8}|gate-[0-9a-f]{7}-[0-9a-f]{4}|build|image-build-[0-9a-f]{8})$')"
      message: "a workspace may only touch the per-Job Secrets"
    # The deploy pipeline's Jobs and the build Secret (k3s-build.sh, the pre-pull): the isnan workspace only (it runs .pilot/deploy.yml).
    - expression: "!((request.resource.resource == 'jobs' && variables.name.matches('^claudepilot-(build|prepull)-')) || (request.resource.resource == 'secrets' && variables.name == 'claudepilot-build')) || request.userInfo.username == 'system:serviceaccount:isnan-claudepilot:ws-isnan-jobs'"
      message: "only the isnan workspace (the deploy pipeline) builds images and pre-pulls"
    # A PATCH answers with the whole Secret: only gate-job (claudepilot, isnan workspace) patches, and only its own gate Secrets, so one org
    # cannot read the other's in-flight per-Job credentials that way. konfersi never runs gate-job: its deletes stay on claudepilot-job-*.
    # (Since 2026-10-31 gate-job.sh no longer patches its Secret: it creates it owned by the suspended Job. The rule stays as it was applied.)
    - expression: "request.resource.resource != 'secrets' || request.operation != 'UPDATE' || (request.userInfo.username == 'system:serviceaccount:isnan-claudepilot:ws-isnan-jobs' && variables.name.startsWith('claudepilot-gate-'))"
      message: "only gate-job (isnan workspace) patches Secrets, and only claudepilot-gate-*"
    # T-3332 (2026-11-02): Konfersi's compute stg deploy builds its container image with image-build.sh (kaniko) and pushes it to Cloudflare's
    # registry with its own credential; that Job's Secret (the push and clone credential) is the only other Secret it may touch.
    - expression: "request.resource.resource != 'secrets' || request.userInfo.username != 'system:serviceaccount:isnan-claudepilot:ws-konfersi-jobs' || variables.name.startsWith('claudepilot-job-') || variables.name.matches('^claudepilot-image-build-[0-9a-f]{8}$')"
      message: "the konfersi workspace touches only claudepilot-job-* and claudepilot-image-build-* Secrets"
    # ...and it never pushes into this cluster's registry (registry.int.isnan.me, its in-cluster service): every image-build Job of konfersi
    # names Cloudflare's registry as its destination, so it cannot replace a ClaudePilot image.
    - expression: "request.resource.resource != 'jobs' || request.operation == 'DELETE' || request.userInfo.username != 'system:serviceaccount:isnan-claudepilot:ws-konfersi-jobs' || !variables.name.startsWith('claudepilot-image-build-') || variables.ctrs.all(c, !has(c.args) || c.args.all(a, !a.startsWith('--destination') || a.startsWith('--destination=registry.cloudflare.com/')))"
      message: "the konfersi workspace builds images only for registry.cloudflare.com"
    - expression: "request.resource.resource != 'configmaps' || variables.name.startsWith('claudepilot-gate-result-')"
      message: "a workspace may only touch gate-result ConfigMaps"
    - expression: "variables.pod == null || (has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false)"
      message: "Jobs from a workspace set automountServiceAccountToken: false"
    - expression: "variables.pod == null || ((!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName in ['', 'default']) && (!has(variables.pod.serviceAccount) || variables.pod.serviceAccount in ['', 'default']))"
      message: "Jobs from a workspace run as the default service account"
    - expression: "variables.pod == null || !has(variables.pod.volumes) || variables.pod.volumes.all(v, has(v.emptyDir) || (has(v.secret) && v.secret.secretName == object.metadata.name))"
      message: "Jobs from a workspace use emptyDir volumes only, or their own per-Job Secret (image-build.sh's registry config)"
    - expression: "variables.pod == null || !((has(variables.pod.hostNetwork) && variables.pod.hostNetwork) || (has(variables.pod.hostPID) && variables.pod.hostPID) || (has(variables.pod.hostIPC) && variables.pod.hostIPC))"
      message: "no host namespaces"
    - expression: "variables.ctrs.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)"
      message: "no privileged containers"
    - expression: "variables.ctrs.all(c, !has(c.envFrom) || size(c.envFrom) == 0)"
      message: "no envFrom"
    # The one exception: the portal build reads the GitHub Packages token from claudepilot-build (deploy/k3s-build/portal-job.yaml).
    - expression: "variables.ctrs.all(c, !has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || e.valueFrom.secretKeyRef.name == object.metadata.name || (object.metadata.name == 'claudepilot-build-portal' && e.valueFrom.secretKeyRef.name == 'claudepilot-build')))"
      message: "secretKeyRef only to the Job's own Secret (claudepilot-build-portal: claudepilot-build)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: claudepilot-ws-jobs-guard, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
spec:
  policyName: claudepilot-ws-jobs-guard
  validationActions: [Deny]
---
# The Argo CD refresh the deploy pipeline asks for (patch on Application isnan-claudepilot, above): the patch may change the annotation
# argocd.argoproj.io/refresh (normal or hard) and nothing else. Spec, operation (a sync to any revision), status, labels, finalizers,
# owners and every other annotation stay as they are, so the patch right never becomes "deploy something else". A create or delete
# fails the first rule (and finds no object to compare), so it is refused too (RBAC grants neither).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: claudepilot-ws-argo-refresh-guard, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: isnan-argocd}}
    objectSelector: {}
    resourceRules:
      - {apiGroups: [argoproj.io], apiVersions: ["*"], operations: [CREATE, UPDATE, DELETE], resources: [applications], scope: "*"}
  matchConditions:
    - name: org-workspace-sa
      expression: "request.userInfo.username in ['system:serviceaccount:isnan-claudepilot:ws-isnan-jobs', 'system:serviceaccount:isnan-claudepilot:ws-konfersi-jobs']"
  validations:
    - expression: "request.operation == 'UPDATE' && object.metadata.name == 'isnan-claudepilot'"
      message: "a workspace only refreshes the Application isnan-claudepilot"
    - expression: "object.spec == oldObject.spec"
      message: "the refresh never changes the Application's spec"
    - expression: "has(object.operation) == has(oldObject.operation) && (!has(object.operation) || object.operation == oldObject.operation)"
      message: "the refresh never starts or changes an operation"
    - expression: "has(object.status) == has(oldObject.status) && (!has(object.status) || object.status == oldObject.status)"
      message: "the refresh never changes the status"
    - expression: "has(object.metadata.labels) == has(oldObject.metadata.labels) && (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels)"
      message: "the refresh never changes labels"
    - expression: "has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) && (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers)"
      message: "the refresh never changes finalizers"
    - expression: "has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)"
      message: "the refresh never changes owners"
    - expression: "!has(object.metadata.annotations) || object.metadata.annotations.all(k, k == 'argocd.argoproj.io/refresh' || (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] == object.metadata.annotations[k]))"
      message: "the refresh adds or changes only the annotation argocd.argoproj.io/refresh"
    - expression: "!has(oldObject.metadata.annotations) || oldObject.metadata.annotations.all(k, k == 'argocd.argoproj.io/refresh' || (has(object.metadata.annotations) && k in object.metadata.annotations))"
      message: "the refresh removes no other annotation"
    - expression: "!has(object.metadata.annotations) || !('argocd.argoproj.io/refresh' in object.metadata.annotations) || object.metadata.annotations['argocd.argoproj.io/refresh'] in ['normal', 'hard']"
      message: "argocd.argoproj.io/refresh is normal or hard"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: claudepilot-ws-argo-refresh-guard, annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}}
spec:
  policyName: claudepilot-ws-argo-refresh-guard
  validationActions: [Deny]
