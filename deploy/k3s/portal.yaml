# ClaudePilot portal on the isnan k3s cluster, at https://pilot.ai.isnan.me (internal only: *.ai.isnan.me resolves privately,
# there is no public DNS or tunnel route). State (the portal database, backups, knowledge, and the key that seals stored
# secrets) lives on one volume; the key sits in a Secret. Images are built for linux/amd64 and pushed to registry.int.isnan.me.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claudepilot-data
  namespace: isnan-claudepilot
  annotations:
    # The portal's whole state: never pruned or deleted by a sync or by removing the app.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claudepilot-portal
  namespace: isnan-claudepilot
  labels:
    app: claudepilot-portal
spec:
  replicas: 1
  strategy:
    type: Recreate # one SQLite database on one ReadWriteOnce volume
  selector:
    matchLabels:
      app: claudepilot-portal
  template:
    metadata:
      labels:
        app: claudepilot-portal
    spec:
      serviceAccountName: claudepilot-portal
      nodeSelector:
        kubernetes.io/hostname: k3s-node2
      containers:
        - name: portal
          image: registry.int.isnan.me/claudepilot/portal:2026.11.01-16
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Sign-in code: the Secret claudepilot-server (key "code"), made by hand, never in git (README.md).
            - name: PORTAL_SERVER_CODE
              valueFrom:
                secretKeyRef:
                  name: claudepilot-server
                  key: code
            # Traefik is the only way in: its X-Forwarded-For is the client address (sign-in rate limit).
            - name: PORTAL_TRUST_PROXY
              value: "true"
            # Cloudflare's tunnel is the hop Traefik sees for public visitors (a cluster address): their address is CF-Connecting-IP,
            # read only when that hop is private (clientAddress.ts), and only for the reporter's shown IP (rate limits keep the hop).
            - name: PORTAL_TRUST_CLOUDFLARE
              value: "true"
            # The origin an SSO provider sends the browser back to (T-1052); never taken from a request's Host here.
            - name: PORTAL_SSO_ORIGIN
              value: "https://pilot.ai.isnan.me"
            # Organizations slice 4 (docs/prd/organizations.md §6.11): the Admin console answers on this host only (its own session and
            # bundle; the IngressRoute claudepilot-admin below). Unset turns the console off.
            - name: PORTAL_ADMIN_HOST
              value: admin.pilot.ai.isnan.me
            # The Admin console's sign-in through git.isnan.me (owner, 2026-11-01; apps/server/src/admin/oidc.ts): ONLY the identities on
            # PORTAL_ADMIN_OIDC_ALLOW (the verified email, or preferred_username) that map to an active admin account; everyone else is
            # refused and shows up as admin.signin_refused in the console's Audit. Client id and secret: the Secret claudepilot-admin-oidc
            # (keys client-id, client-secret), made by hand, never in git; optional, so the portal starts without it and the button is
            # hidden (any value missing: OIDC off, password sign-in unchanged). The OAuth app's redirect URI at Gitea:
            # https://admin.pilot.ai.isnan.me/admin-api/session/oidc/callback. ALLOW_PRIVATE: git.isnan.me resolves to a cluster address
            # inside the cluster, which the OIDC client's SSRF guard refuses unless allowed (the issuer is set here, not by a user).
            - name: PORTAL_ADMIN_OIDC_ISSUER
              value: https://git.isnan.me
            - name: PORTAL_ADMIN_OIDC_ALLOW
              value: alfian@isnan.me
            - name: PORTAL_ADMIN_OIDC_ALLOW_PRIVATE
              value: "true"
            # Org SSO (organizations slice 10): these IdPs run in this cluster and resolve privately; the operator trusts exactly these origins.
            - name: PORTAL_ORG_SSO_TRUSTED_ISSUERS
              value: "https://auth.konfersi.com,https://auth.kohi-labs.com,https://git.isnan.me"
            - name: PORTAL_ADMIN_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: claudepilot-admin-oidc
                  key: client-id
                  optional: true
            - name: PORTAL_ADMIN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: claudepilot-admin-oidc
                  key: client-secret
                  optional: true
            # Workspaces are pods of this cluster (the portal's service account, in-cluster).
            - name: PORTAL_K8S_ENABLED
              value: "true"
            - name: PORTAL_K8S_NAMESPACE
              value: isnan-claudepilot-workspaces
            # One more Kubernetes target per org (workspace-orgs.yaml; apps/server/src/workspaces/kubeTargets.ts; migration plan B.5, 2026-10-31):
            # workspaces `<id>/<name>` in the org's namespace; `kubernetes` above stays as it is. Placement is the target's: nodeSelector (here a
            # hostname, in place of PORTAL_K8S_NODE_SELECTOR) at every create, set by the portal, not by a hand patch; a create may name one of
            # preferredNodes instead (the New workspace dialog's Node select). The home volume follows the pod (local-path binds
            # WaitForFirstConsumer) and keeps it on that node. cpus/memoryMb: the limits a create gets by default; cpuRequest/memoryRequest:
            # what it reserves (in place of PORTAL_K8S_CPU_REQUEST / PORTAL_K8S_MEMORY_REQUEST). Storage is PORTAL_K8S_STORAGE. image: isnan and
            # konfersi run the dev image (kubectl, chromium, shellcheck; what kohi-event runs), put back on a workspace at its every start, so one
            # made with PORTAL_K8S_IMAGE follows it at the next stop and start (no hand patch); kohilabs keeps PORTAL_K8S_IMAGE.
            - name: PORTAL_K8S_TARGETS
              value: '[{"id":"isnan","label":"isnan","namespace":"isnan-pilot-ws-isnan","nodeSelector":{"kubernetes.io/hostname":"k3s-node2"},"preferredNodes":["k3s-node2","k3s-node3"],"cpus":4,"memoryMb":8192,"cpuRequest":"1000m","memoryRequest":"3Gi","image":"registry.int.isnan.me/claudepilot/workspace:2.1.296-dev-2026.10.13-1"},{"id":"konfersi","label":"konfersi","namespace":"isnan-pilot-ws-konfersi","nodeSelector":{"kubernetes.io/hostname":"k3s-node2"},"preferredNodes":["k3s-node2","k3s-node3"],"cpus":4,"memoryMb":12288,"cpuRequest":"1500m","memoryRequest":"5Gi","image":"registry.int.isnan.me/claudepilot/workspace:2.1.296-dev-2026.10.13-1"},{"id":"kohilabs","label":"kohilabs","namespace":"isnan-pilot-ws-kohilabs","nodeSelector":{"kubernetes.io/hostname":"k3s-master"},"preferredNodes":["k3s-master","k3s-node3"],"cpus":4,"memoryMb":6144,"cpuRequest":"500m","memoryRequest":"2Gi"}]'
            - name: PORTAL_K8S_IMAGE
              value: registry.int.isnan.me/claudepilot/workspace:2.1.296-2026.10.15-2
            # Browser pool on Kubernetes (browser-desktop-pool PRD §10, B3 verified on a rig): the image of the `browser` container a
            # workspace gets when a Browser pool is assigned. Unset: browsers are not offered on this target. Assigning one restarts the
            # workspace at its next start (the restart rule); egress stays isolated (the default).
            # t623-2026.10.16-1: the first image with the headers builder (images/browser/cpb/headers-ext.mjs, T-623); built by hand with
            # scripts/k3s-build.sh until the deploy pipeline builds it (T-911).
            - name: PORTAL_K8S_BROWSER_IMAGE
              value: registry.int.isnan.me/claudepilot/browser:t623-2026.10.16-1
            # The browser's egress policy covers the WHOLE pod (one network namespace, browser/kube.ts egressPolicy): `isolate` would cut
            # the dev workspace's Claude Code and shell off the API server (job-run), the internal ingress (git.konfersi.com, the registry,
            # pilot) and the LAN (T-619, blind review F3). Off: the pod keeps the egress it has today; the browser is held instead by the
            # pool's site allowlist (stg hosts and localhost only) and its tool rules.
            - name: PORTAL_K8S_BROWSER_EGRESS
              value: "off"
            # Connect GitHub (codespaces-poc.md §8.2, T-557 S3): the owner's OAuth App "ClaudePilot" with the device flow on. A client ID is
            # public; there is no client secret anywhere, on purpose. Scopes: the default, `codespace`.
            - name: PORTAL_GITHUB_CLIENT_ID
              value: Ov23liLYMjgpDAfrkayB
            - name: PORTAL_K8S_STORAGE_CLASS
              value: local-path
            - name: PORTAL_K8S_STORAGE
              value: 10Gi
            # Keep workspace pods off the control-plane node: any worker-pool node (k3s-node2, k3s-node3).
            - name: PORTAL_K8S_NODE_SELECTOR
              value: isnan.me/pool=worker
            # What a workspace pod asks the scheduler to reserve (its limits stay): with only limits set Kubernetes reserves the whole
            # limit, and a 2-CPU workspace stayed Pending ("Insufficient cpu") while the node was 40% busy.
            # 1 CPU and 2 GiB (owner, 2026-10-13): at 250m the dev workspace lost every fight for CPU against Jobs and neighbours on a busy node
            # (limits 4 CPU and 8 GiB stay). A pod picks the new values up at its next restart.
            - name: PORTAL_K8S_CPU_REQUEST
              value: "1"
            - name: PORTAL_K8S_MEMORY_REQUEST
              value: 2Gi
            # How workspaces (other namespace) reach the portal: its Portal MCP tools, session events.
            - name: PORTAL_INTERNAL_URL
              value: http://claudepilot-portal.isnan-claudepilot.svc.cluster.local:3000
            # Addresses shown to people and used in links, notifications and the Connect wizard.
            - name: PORTAL_UI_URL
              value: https://pilot.ai.isnan.me
            - name: PORTAL_MCP_URL
              value: https://pilot.ai.isnan.me/mcp
            - name: PORTAL_PUSH_CONTACT
              value: https://pilot.ai.isnan.me
            # Connect (agents that dial out): on; the certificate is the public wildcard one, no private CA needed.
            - name: PORTAL_CONNECT_ENABLED
              value: "true"
            - name: PORTAL_CONNECT_URL
              value: https://pilot.ai.isnan.me
            # T-948 app ports (docs/prd/app-ports.md): a workspace's web app on its own host app-<name>-<port>.ai.isnan.me (the
            # IngressRoute claudepilot-app-ports below). Unset turns the feature off.
            # App hosts are <port>[-<app>]-<workspace>.pilot.ai.isnan.me (owner, 2026-10-18), one label under the portal's own name.
            - name: PORT_PROXY_HOST_SUFFIX
              value: pilot.ai.isnan.me
            # T-2589: V8's default old space (~970 MB here) died of heap OOM (exit 139) while the 2Gi limit had room. 1.5 GiB of heap
            # leaves ~0.5 GiB of the limit for buffers, native memory and child processes.
            - name: NODE_OPTIONS
              value: --max-old-space-size=1536
          # T-365: a 1 s timeout dropped a slow but alive portal from the Service and the liveness kill restarted it while the node's
          # disk was busy, which made the stall longer. Out of the Service after 3 slow checks (30 s), restarted only after 5 minutes.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /data
              subPath: data
            # The key that seals stored secrets (PORTAL_SECRET_KEY_FILE=/secrets/portal_secret_key, set by the image): the Secret
            # claudepilot-secret-key, made by hand, never in git (README.md). Without it the portal starts LOCKED.
            - name: secret-key
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: claudepilot-data
        - name: secret-key
          secret:
            secretName: claudepilot-secret-key
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: claudepilot-portal
  namespace: isnan-claudepilot
spec:
  selector:
    app: claudepilot-portal
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: claudepilot-portal
  namespace: isnan-claudepilot
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pilot.ai.isnan.me`)
      kind: Rule
      services:
        - name: claudepilot-portal
          port: 3000
  tls:
    certResolver: cloudflare
    domains:
      - main: "*.pilot.ai.isnan.me"
---
# Organizations slice 4 (docs/prd/organizations.md §6.11): the Admin console's host, to the same portal Service, whose host split answers
# only the console there (and the console nowhere else). The *.pilot.ai.isnan.me certificate covers it; the private DNS record already
# resolves. Its own route, so a mistake here cannot take the portal's host down.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: claudepilot-admin
  namespace: isnan-claudepilot
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`admin.pilot.ai.isnan.me`)
      kind: Rule
      services:
        - name: claudepilot-portal
          port: 3000
  tls:
    certResolver: cloudflare
    domains:
      - main: "*.pilot.ai.isnan.me"
---
# T-948 app ports: every app-<name>-<port>.ai.isnan.me host goes to the same portal Service, whose app-port proxy answers it (and only it).
# One label under ai.isnan.me, so the existing *.ai.isnan.me certificate covers it. Its own route, so a mistake here can't take the
# portal's host down. HostRegexp is Traefik v3 syntax (a Go regexp).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: claudepilot-app-ports
  namespace: isnan-claudepilot
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`^[0-9]{4,5}-[a-z0-9-]+\.pilot\.ai\.isnan\.me$`)
      kind: Rule
      services:
        - name: claudepilot-portal
          port: 3000
  tls:
    certResolver: cloudflare
    domains:
      - main: "*.ai.isnan.me"
