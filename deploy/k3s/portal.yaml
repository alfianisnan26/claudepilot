# ClaudePilot portal on the isnan k3s cluster, at https://pilot.ai.isnan.me (internal only: *.ai.isnan.me resolves privately,
# there is no public DNS or tunnel route). State (the portal database, backups, knowledge, and the key that seals stored
# secrets) lives on one volume; the key sits in a Secret. Images are built for linux/amd64 and pushed to registry.int.isnan.me.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claudepilot-data
  namespace: isnan-claudepilot
  annotations:
    # The portal's whole state: never pruned or deleted by a sync or by removing the app.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claudepilot-portal
  namespace: isnan-claudepilot
  labels:
    app: claudepilot-portal
spec:
  replicas: 1
  strategy:
    type: Recreate # one SQLite database on one ReadWriteOnce volume
  selector:
    matchLabels:
      app: claudepilot-portal
  template:
    metadata:
      labels:
        app: claudepilot-portal
    spec:
      serviceAccountName: claudepilot-portal
      nodeSelector:
        kubernetes.io/hostname: k3s-node2
      containers:
        - name: portal
          image: registry.int.isnan.me/claudepilot/portal:2026.10.17-11
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Sign-in code: the Secret claudepilot-server (key "code"), made by hand, never in git (README.md).
            - name: PORTAL_SERVER_CODE
              valueFrom:
                secretKeyRef:
                  name: claudepilot-server
                  key: code
            # Traefik is the only way in: its X-Forwarded-For is the client address (sign-in rate limit).
            - name: PORTAL_TRUST_PROXY
              value: "true"
            # The origin an SSO provider sends the browser back to (T-1052); never taken from a request's Host here.
            - name: PORTAL_SSO_ORIGIN
              value: "https://pilot.ai.isnan.me"
            # Workspaces are pods of this cluster (the portal's service account, in-cluster).
            - name: PORTAL_K8S_ENABLED
              value: "true"
            - name: PORTAL_K8S_NAMESPACE
              value: isnan-claudepilot-workspaces
            - name: PORTAL_K8S_IMAGE
              value: registry.int.isnan.me/claudepilot/workspace:2.1.296-2026.10.15-2
            # Browser pool on Kubernetes (browser-desktop-pool PRD §10, B3 verified on a rig): the image of the `browser` container a
            # workspace gets when a Browser pool is assigned. Unset: browsers are not offered on this target. Assigning one restarts the
            # workspace at its next start (the restart rule); egress stays isolated (the default).
            # t623-2026.10.16-1: the first image with the headers builder (images/browser/cpb/headers-ext.mjs, T-623); built by hand with
            # scripts/k3s-build.sh until the deploy pipeline builds it (T-911).
            - name: PORTAL_K8S_BROWSER_IMAGE
              value: registry.int.isnan.me/claudepilot/browser:t623-2026.10.16-1
            # The browser's egress policy covers the WHOLE pod (one network namespace, browser/kube.ts egressPolicy): `isolate` would cut
            # the dev workspace's Claude Code and shell off the API server (job-run), the internal ingress (git.konfersi.com, the registry,
            # pilot) and the LAN (T-619, blind review F3). Off: the pod keeps the egress it has today; the browser is held instead by the
            # pool's site allowlist (stg hosts and localhost only) and its tool rules.
            - name: PORTAL_K8S_BROWSER_EGRESS
              value: "off"
            # Connect GitHub (codespaces-poc.md §8.2, T-557 S3): the owner's OAuth App "ClaudePilot" with the device flow on. A client ID is
            # public; there is no client secret anywhere, on purpose. Scopes: the default, `codespace`.
            - name: PORTAL_GITHUB_CLIENT_ID
              value: Ov23liLYMjgpDAfrkayB
            - name: PORTAL_K8S_STORAGE_CLASS
              value: local-path
            - name: PORTAL_K8S_STORAGE
              value: 10Gi
            # Keep workspace pods off the control-plane node (it is short of memory).
            - name: PORTAL_K8S_NODE_SELECTOR
              value: kubernetes.io/hostname=k3s-node2
            # What a workspace pod asks the scheduler to reserve (its limits stay): with only limits set Kubernetes reserves the whole
            # limit, and a 2-CPU workspace stayed Pending ("Insufficient cpu") while the node was 40% busy.
            # 1 CPU and 2 GiB (owner, 2026-10-13): at 250m the dev workspace lost every fight for CPU against Jobs and neighbours on a busy node
            # (limits 4 CPU and 8 GiB stay). A pod picks the new values up at its next restart.
            - name: PORTAL_K8S_CPU_REQUEST
              value: "1"
            - name: PORTAL_K8S_MEMORY_REQUEST
              value: 2Gi
            # How workspaces (other namespace) reach the portal: its Portal MCP tools, session events.
            - name: PORTAL_INTERNAL_URL
              value: http://claudepilot-portal.isnan-claudepilot.svc.cluster.local:3000
            # Addresses shown to people and used in links, notifications and the Connect wizard.
            - name: PORTAL_UI_URL
              value: https://pilot.ai.isnan.me
            - name: PORTAL_MCP_URL
              value: https://pilot.ai.isnan.me/mcp
            - name: PORTAL_PUSH_CONTACT
              value: https://pilot.ai.isnan.me
            # Connect (agents that dial out): on; the certificate is the public wildcard one, no private CA needed.
            - name: PORTAL_CONNECT_ENABLED
              value: "true"
            - name: PORTAL_CONNECT_URL
              value: https://pilot.ai.isnan.me
            # T-948 app ports (docs/prd/app-ports.md): a workspace's web app on its own host app-<name>-<port>.ai.isnan.me (the
            # IngressRoute claudepilot-app-ports below). Unset turns the feature off.
            - name: PORT_PROXY_HOST_SUFFIX
              value: ai.isnan.me
          # T-365: a 1 s timeout dropped a slow but alive portal from the Service and the liveness kill restarted it while the node's
          # disk was busy, which made the stall longer. Out of the Service after 3 slow checks (30 s), restarted only after 5 minutes.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /data
              subPath: data
            # The key that seals stored secrets (PORTAL_SECRET_KEY_FILE=/secrets/portal_secret_key, set by the image): the Secret
            # claudepilot-secret-key, made by hand, never in git (README.md). Without it the portal starts LOCKED.
            - name: secret-key
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: claudepilot-data
        - name: secret-key
          secret:
            secretName: claudepilot-secret-key
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: claudepilot-portal
  namespace: isnan-claudepilot
spec:
  selector:
    app: claudepilot-portal
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: claudepilot-portal
  namespace: isnan-claudepilot
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pilot.ai.isnan.me`)
      kind: Rule
      services:
        - name: claudepilot-portal
          port: 3000
  tls:
    certResolver: cloudflare
    domains:
      - main: "*.ai.isnan.me"
---
# T-948 app ports: every app-<name>-<port>.ai.isnan.me host goes to the same portal Service, whose app-port proxy answers it (and only it).
# One label under ai.isnan.me, so the existing *.ai.isnan.me certificate covers it. Its own route, so a mistake here can't take the
# portal's host down. HostRegexp is Traefik v3 syntax (a Go regexp).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: claudepilot-app-ports
  namespace: isnan-claudepilot
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`^app-[a-z0-9-]+\.ai\.isnan\.me$`)
      kind: Rule
      services:
        - name: claudepilot-portal
          port: 3000
  tls:
    certResolver: cloudflare
    domains:
      - main: "*.ai.isnan.me"
