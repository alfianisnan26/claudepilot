# pilot.dev.isnan.me on the owner's Mac: Caddy (HTTPS) in front of the k3s portal. The portal, its database, sessions and
# workspaces are the cluster's (deploy/k3s); nothing else runs here. From the devcontainer:
#   docker --context host compose -p claudepilot -f deploy/compose.yaml up -d --build
name: claudepilot

services:
  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: claudepilot-caddy:latest
    restart: unless-stopped
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-pilot.dev.isnan.me}
      PORTAL_TLS: ${PORTAL_TLS:-internal}
      # The cluster's ingress (Traefik); pilot.ai.isnan.me resolves to it on the local network.
      PORTAL_UPSTREAM: ${PORTAL_UPSTREAM:-192.168.100.5}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
