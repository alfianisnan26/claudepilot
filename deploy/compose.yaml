# Production portal behind Caddy (HTTPS). Built once from the repo; rebuild to deploy changes:
#   docker compose -f deploy/compose.yaml up -d --build
name: claudepilot

services:
  portal:
    build:
      context: ..
      dockerfile: Dockerfile
      secrets: [node_auth_token]
    image: claudepilot-portal:latest
    restart: unless-stopped
    environment:
      PORTAL_SERVER_CODE: ${PORTAL_SERVER_CODE:-}
      # Only Caddy reaches the portal, so its X-Forwarded-For is the client address (sign-in rate limit).
      PORTAL_TRUST_PROXY: "true"
      PORTAL_DOCKER_SOCKET: /var/run/docker.sock
      PORTAL_K8S_ENABLED: "false"
      # Connect (agents that dial out to this portal) stays OFF in production until its acceptance and abuse suite has run
      # (docs/open-items.md). Remove this line to turn it on.
      PORTAL_CONNECT_ENABLED: "false"
    volumes:
      - portal-data:/data
      - portal-secrets:/secrets
      # Workspaces run on this host's Docker. Access to the socket is root on the host.
      - /var/run/docker.sock:/var/run/docker.sock
    expose: ["3000"]

  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: claudepilot-caddy:latest
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_healthy
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-pilot.dev.isnan.me}
      PORTAL_TLS: ${PORTAL_TLS:-internal}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

volumes:
  portal-data:
  portal-secrets:
  caddy-data:
  caddy-config:
