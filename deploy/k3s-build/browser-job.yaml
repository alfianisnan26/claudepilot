# Builds the browser image (images/browser, browser & desktop PRD §14.1) IN the cluster (kaniko) and pushes it to the internal registry; no secret needed.
#   kubectl apply -f deploy/k3s-build/browser-job.yaml        # edit the commit and the tag first
apiVersion: batch/v1
kind: Job
metadata:
  name: claudepilot-build-browser
  namespace: isnan-claudepilot
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      # No node: k3s-node2 had 0.19 CPU free by requests on 2026-10-13, so the scheduler picks the one with room.
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --context=git://github.com/alfianisnan26/claudepilot.git#refs/heads/main#COMMIT
            - --context-sub-path=images/browser
            - --dockerfile=Dockerfile
            - --destination=registry.isnan-registry.svc.cluster.local:5000/claudepilot/browser:TAG
            - --insecure
            - --cache=false
            - --snapshot-mode=redo
            - --push-retry=3
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {cpu: "4", memory: 6Gi}
