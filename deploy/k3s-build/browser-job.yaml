# Builds the browser image (images/browser, browser & desktop PRD §14.1) IN the cluster (kaniko) and pushes it to the internal registry; no secret needed.
#   kubectl apply -f deploy/k3s-build/browser-job.yaml        # edit the commit and the tag first
apiVersion: batch/v1
kind: Job
metadata:
  name: claudepilot-build-browser
  namespace: isnan-claudepilot
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      # No node pinned: k3s-node2 had 0.19 CPU free by requests on 2026-10-13, so the scheduler picks the one with room. Preferred (never
      # required, T-524): not the control-plane node (k3s-master, 15 GB, also the API server); see job-run.yaml for how the weights add up.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference: {matchExpressions: [{key: isnan.me/pool, operator: NotIn, values: [control]}]}
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --context=git://github.com/alfianisnan26/claudepilot.git#refs/heads/main#COMMIT
            - --context-sub-path=images/browser
            - --dockerfile=Dockerfile
            - --destination=registry.isnan-registry.svc.cluster.local:5000/claudepilot/browser:TAG
            - --insecure
            - --cache=false
            - --snapshot-mode=redo
            - --push-retry=3
          # Memory request = limit (T-524): 1Gi requested with 6Gi allowed let the scheduler put a big build on a node without room for it.
          # 6Gi is the old limit, kept (this build was not measured; lowering it would risk an OOMKilled build): only k3s-node2 can hold it.
          resources:
            requests: {cpu: 100m, memory: 6Gi}
            limits: {cpu: "4", memory: 6Gi}
