# The release gate (scripts/gate.sh) as a Job in the cluster, on CPUs other than the development pod's (T-37). Started only by
# scripts/gate-job.sh, which fills in NAME, COMMIT, STEPS, IMAGE and VERDICT (its own scripts/gate-verdict.sh, base64, so an older commit is
# read the same way), makes the Secret NAME (the GitHub Packages token for npm ci,
# the private @isnanme packages) for the Job's life, and reads the verdict from the log. Several can run at once, one per name.
# It prefers a node WITHOUT a development workspace pod (anti-affinity below): on the same node as the pod its 100m request lost every
# fight for CPU against the agents (deploy 10: 0.4 CPU used on k3s-node2 at 95% while k3s-master was at 27%, the suite ran twice as long and
# timing tests failed). The request is 1 CPU so the node's share is real; the limit lets it use up to 4 where it lands.
# /tmp (the clean copy, node_modules, the build, the tests' temp databases) is an emptyDir in MEMORY (T-95 item 3): on the container
# overlay the suite was IO-bound (about 60% IO pressure at 33m of CPU on k3s-master, 31+ min: hundreds of node:sqlite databases with
# fsync, plus npm ci), in memory fsync costs nothing. It counts against the container's memory: sizeLimit 3Gi (node_modules is about
# 400 MiB, the copy and the logs well under that). Memory requested = limited (T-524): 2Gi requested with 8Gi allowed overcommitted the
# node. 8Gi is the old limit, kept: the server suite alone peaked at 1480Mi (job-run claudepilot-job-4c34ebf9), but the gate's typecheck and
# web build at GATE_CONCURRENCY 3 were not measured yet. Lower it from the "memory peak=" line this Job prints, never below peak + 50%.
apiVersion: batch/v1
kind: Job
metadata:
  name: NAME
  namespace: isnan-claudepilot
  labels: {app: claudepilot-gate, claudepilot-gate/by: BY_WHOM}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app: claudepilot-gate}
      annotations: {kubectl.kubernetes.io/default-container: gate}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      affinity:
        # Placement as in job-run.yaml (T-365, T-524; how the weights add up is explained there). All PREFERRED, never required: a required
        # rule left every Job Pending (2026-10-15). Away from the control-plane node (k3s-master, also the API server), away from the
        # portal's node and from workspace pods; with memory requested = limited the node with the most room left wins the tie.
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference: {matchExpressions: [{key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}]}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaces: [isnan-claudepilot]
                labelSelector: {matchLabels: {app: claudepilot-portal}}
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaces: [isnan-claudepilot-workspaces]
                labelSelector: {matchLabels: {claudepilot.managed: "true"}}
      # T-401: the token is in the init container `fetch` alone, which runs no code of the commit or of a dependency: it clones, and fills
      # npm's cache on /tmp with `npm ci --ignore-scripts` in a throwaway copy. The `gate` container has no secret; gate.sh's own npm ci
      # (with the install scripts) installs from that cache (prefer-offline), so no install script, test or build ever sees the token.
      initContainers:
        - name: fetch
          image: IMAGE
          env:
            - {name: COMMIT, value: "COMMIT"}
            - name: NODE_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: NAME, key: node-auth-token}}
          command: [bash, -c]
          args:
            - |
              # GATE-FETCH BEGIN
              set -u
              root=${GATE_ROOT:-/tmp}
              (
              export HOME=${GATE_FETCH_HOME:-/fetch-home} npm_config_cache=$root/npm-cache npm_config_update_notifier=false
              mkdir -p "$HOME"
              cd "$root" && git init -q src && cd src || exit 1
              if ! git fetch -q --depth 1 "${GATE_REPO_URL:-https://github.com/alfianisnan26/claudepilot.git}" "$COMMIT" || ! git checkout -q FETCH_HEAD; then
                echo "GATE-VERDICT: red: $COMMIT is not on GitHub (push it first)"; exit 1
              fi
              rm -rf "$root/warm"; mkdir -p "$root/warm"
              if ! { git archive HEAD | tar -x -C "$root/warm" && (cd "$root/warm" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error); }; then
                echo "npm cache: filling it failed; gate.sh's npm ci says why"
              fi
              rm -rf "$root/warm"
              # No token VALUE in what the gate container gets (the pattern goes to grep on a pipe; only file names are printed).
              tok=${NODE_AUTH_TOKEN:-}
              if [ "${#tok}" -ge 8 ] && printf '%s\n' "$tok" | grep -rlF -f - "$root" 2>/dev/null | head -n 20 | grep .; then
                echo "GATE-VERDICT: red: the token is in the files above, which the gate would see"; exit 3
              fi
              echo "credentials: used for npm's cache only; none is in the files the gate gets"
              ) > "$root/fetch.log" 2>&1
              echo $? > "$root/fetch.rc"
              # GATE-FETCH END
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: fetch-home, mountPath: /fetch-home}
          resources:
            requests: {cpu: 1000m, memory: 8Gi}
            limits: {cpu: "4", memory: 8Gi}
      containers:
        - name: gate
          image: IMAGE
          env:
            - {name: COMMIT, value: "COMMIT"}
            - {name: GATE_STEPS, value: "STEPS"}
            - {name: GATE_CONCURRENCY, value: "3"}
            - {name: GATE_FILES, value: "FILES"}
            - {name: GATE_VERDICT_SH, value: "VERDICT"}
            # The cache the fetch container filled (no token here: T-401).
            - {name: npm_config_cache, value: /tmp/npm-cache}
            - {name: npm_config_prefer_offline, value: "true"}
          command: [bash, -c]
          args:
            - |
              set -u
              cat /tmp/fetch.log 2>/dev/null
              frc=$(cat /tmp/fetch.rc 2>/dev/null || true)
              if [ "$frc" != 0 ]; then grep -q '^GATE-VERDICT: ' /tmp/fetch.log 2>/dev/null || echo "GATE-VERDICT: red: the fetch failed (rc=${frc:-none})"; exit 1; fi
              cd /tmp/src || exit 1
              [ -n "$GATE_FILES" ] || unset GATE_FILES
              GATE_DIR=/tmp/gate bash scripts/gate.sh HEAD
              echo "=== SUMMARY"; cat /tmp/gate.logs/SUMMARY.txt 2>/dev/null
              # The Job's own memory (T-524): the cgroup's peak (in-memory /tmp included) against its limit, the number the limit is sized from.
              mib() { v=$(cat "/sys/fs/cgroup/$1" 2>/dev/null) && [[ $v =~ ^[0-9]+$ ]] && echo "$((v / 1048576))Mi" || echo "${v:-?}"; }
              echo "memory peak=$(mib memory.peak) limit=$(mib memory.max) oom_kills=$(sed -n 's/^oom_kill //p' /sys/fs/cgroup/memory.events 2>/dev/null | grep . || echo '?')"
              [ -s /tmp/gate.logs/failures.txt ] && { echo "=== FAILURES (each failing test's own report)"; cat /tmp/gate.logs/failures.txt; }
              for s in npm-ci typecheck web-build; do grep -q "^$s rc=0 " /tmp/gate.logs/SUMMARY.txt 2>/dev/null || { [ -f "/tmp/gate.logs/$s.log" ] && { echo "=== the end of $s's log"; tail -n 40 "/tmp/gate.logs/$s.log"; }; }; done
              printf '%s' "$GATE_VERDICT_SH" | base64 -d > /tmp/gate-verdict.sh && bash /tmp/gate-verdict.sh logs /tmp/gate.logs "$GATE_STEPS"
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 1000m, memory: 8Gi}
            limits: {cpu: "4", memory: 8Gi}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 3Gi}
        - name: fetch-home
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
