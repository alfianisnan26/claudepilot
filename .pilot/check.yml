# Check: the release gate (typecheck, web build, server suite) on every push to integration that changes code. The run starts in this
# workspace and the step sends the gate to the cluster as one Job (D-61: nothing heavy in the pod). The Mac runner it used to prefer was
# decommissioned on 2026-11-01 (owner). The deploy pipeline keeps its own gate: this is the early signal, not the release.
# The logic lives in .pilot/scripts/check.sh.
name: Check
on:
  push:
    branches: [integration]
  manual: {}
timeout: 2h
# Only the newest push needs its check (2026-10-18: 20 runs queued behind one that had run for 7 hours on the Mac runner): a new push stops
# the check in progress and takes its place.
concurrency:
  group: check-claudepilot
  cancel-in-progress: true
jobs:
  gate:
    name: Gate
    # The private @isnanme packages (npm): leased for this run only, masked in the log (owner, 2026-10-17).
    secrets: [NODE_AUTH_TOKEN]
    timeout: 110m
    steps:
      - name: Typecheck, web build, server suite
        run: bash .pilot/scripts/check.sh
