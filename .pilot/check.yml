# Check (owner, 2026-10-15: "yang claudepilot bisa juga dibikin main kesana [the Mac runner], fallback ke workspace"): the release gate
# (typecheck, web build, server suite) on every push to integration that changes code. It runs on the Mac runner when one with the label
# `mac` is online and free; otherwise, or when the hand-off fails, the run starts in this workspace and the step sends the same gate to the
# cluster as one Job (D-61: nothing heavy in the pod). The deploy pipeline keeps its own gate: this is the early signal, not the release.
# The logic lives in .pilot/scripts/check.sh.
name: Check
on:
  push:
    branches: [integration]
  manual: {}
timeout: 2h
# Only the newest push needs its check (2026-10-18: 20 runs queued behind one that had run for 7 hours on the Mac runner): a new push stops
# the check in progress and takes its place.
concurrency:
  group: check-claudepilot
  cancel-in-progress: true
jobs:
  gate:
    name: Gate
    runs-on: { labels: [mac], fallback: workspace }
    # The private @isnanme packages (npm): leased to the Mac runner for this run only, masked in the log (owner, 2026-10-17).
    secrets: [NODE_AUTH_TOKEN]
    timeout: 110m
    steps:
      - name: Typecheck, web build, server suite
        run: bash .pilot/scripts/check.sh
